COM_PHOCAGALLERY="Phoca Gallery"
COM_PHOCAGALLERY_XML_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left\"><p>Phoca Gallery je komponenta pro vytváření a správu obrázkových galerií.</p></div>"

;[6.1.4]
COM_PHOCAGALLERY_FIELD_UPLOAD_IMAGE_REENCODE_LABEL="Překódovat nahrané obrázky (zabezpečení)"
COM_PHOCAGALLERY_FIELD_UPLOAD_IMAGE_REENCODE_DESC="Platí pouze pro obrázky nahrané pomocí nástroje pro nahrávání do galerie Phoca (jednorázové a vícenásobné nahrávání) - nikoli pro obrázky nahrané jiným rozšířením, nebo třeba přes FTP! Pokud je tato možnost povolena, bude každý nahraný obrázek je před uložením dekódován a překódován pomocí GD, což odstraňuje potenciální polyglotové datové zátěže nebo jiná chybně formátovaná data skrytá uvnitř souboru a také odstraňuje komentář identifikující kodér, který GD zapisuje do souborů JPEG. Možnost 'Ano (zachovat data EXIF a ICC)' po překódování navíc obnoví původní metadata EXIF (fotoaparát, GPS, orientaci atd.) a barevný profil ICC. Tato obnova je podporována pouze pro obrázky JPG, PNG a WEBP; u ostatních podporovaných formátů obrázků je soubor stále překódován (pokud je povolen), ale jeho data EXIF/ICC nelze obnovit. Poznámka: krok překódování může zvětšit velikost souboru oproti originálu v závislosti na nastavení kvality překódování."
COM_PHOCAGALLERY_UPLOAD_IMAGE_REENCODE_YES_STRIP_EXIF="Ano (odstranit data EXIF a ICC)"
COM_PHOCAGALLERY_UPLOAD_IMAGE_REENCODE_YES_KEEP_EXIF="Ano (zachovat data EXIF a ICC pro JPG, PNG, WEBP)"
COM_PHOCAGALLERY_UPLOAD_IMAGE_REENCODE_NO="Ne (překódování zakázáno)"

;[6.1.3]
COM_PHOCAGALLERY_WARNING_INVALID_PATH="Varování: Zjištěna neplatná cesta ke složce!"
COM_PHOCAGALLERY_FIELD_HARDEN_FOLDER_LABEL="Zabezpečit složku pro nahrávání"
COM_PHOCAGALLERY_FIELD_HARDEN_FOLDER_DESC="Pokud je tato možnost povolena, do každé nově vytvořené složky galerie bude zapsán soubor .htaccess a web.config, aby se zabránilo přímému spuštění PHP a dalších skriptů na straně serveru nahrávaných uživateli se zlými úmysly."

;[6.1.2]
COM_PHOCAGALLERY_CURRENT_THEME_INSTALLATION_PROCESS="<p>Chcete-li nainstalovat nový motiv, stáhněte si balíček motivu Phoca Gallery, rozbalte jej a:</p><ul><li>Zkopírujte složku <strong>css</strong> z balíčku do složky na serveru: <code>media/com_phocagallery/css/</code></li><li>Zkopírujte složku <strong>images</strong> z balíčku do složky na serveru: <code>media/com_phocagallery/images/</code></li></ul><p>Poté publikujte vybraný soubor CSS v sekci Styly.</p><p><strong>Důležité:</strong> Ujistěte se, že používáte původní balíček motivu a na server zkopírujte pouze soubory CSS a obrázky.</p>"
;[6.1.1]
COM_PHOCAGALLERY_FOSS_DECLARATION="<h3>Prohlášení o svobodném a otevřeném softwaru (FOSS)</h3>"
COM_PHOCAGALLERY_FOSS_DECLARATION_DESCRIPTION="<p>Tento projekt je vyvíjen, distribuován a udržován striktně jako svobodný a otevřený software (FOSS). Je poskytován zcela mimo rámec jakékoli komerční činnosti jako nezávislý veřejný zdroj.</p><p>Další podrobnosti naleznete v souboru <i>FOSS.md</i>, který je součástí tohoto balíčku. Neváhejte přispět a sledovat vývoj na veřejném, nezávislém repozitáři GitHub: <a href=\"https://github.com/PhocaCz\" target=\"_blank\">https://github.com/PhocaCz</a>.</p>"

