PLG_CONTENT_PHOCAGALLERYSLIDESHOW="Obsah - Phoca Gallery Slideshow Plugin"
PLG_CONTENT_PHOCAGALLERYSLIDESHOW_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left\"><p>Plugin <b>Obsah - Phoca Gallery Slideshow Plugin</b> - zobrazuje slideshow obrázků z vybrané kategorie Phoca Gallery</p><p>{pgslideshow id=...|width=...|height=...|delay=...|image=...|pgslink=...|desc=...}</p><p>Velikost obrázku: O - originální, L - velký, M - střední, S - malý</p><p>Například: {pgslideshow id=1|width=100|height=100|delay=3000|image=M}</p><p>Nezapomeňte tento plugin povolit ve <a href='index.php?option=com_plugins'>Správci pluginů</a></p><p><ul><li>Více informací: <a href='http://www.phoca.cz/' target='_blank' >Phoca.cz</a></li><li>Dokumentace: <a href='http://www.phoca.cz/documentation/' target='_blank' >Dokumentace Phoca</a></li><li>Nápověda a podpora: <a href='http://www.phoca.cz/forum/' target='_blank' >Fórum Phoca</a></li></ul></p></div>"
PLG_CONTENT_PHOCAGALLERYSLIDESHOW_PHOCA_GALLERY_ERROR="Chyba Phoca Gallery"
PLG_CONTENT_PHOCAGALLERYSLIDESHOW_PHOCA_GALLERY_IS_NOT_INSTALLED_ON_YOUR_SYSTEM="Komponenta Phoca Gallery není nainstalována!"
